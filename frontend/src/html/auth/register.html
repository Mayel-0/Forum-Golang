{{ define "pageTitle" }}Inscription{{ end }}

{{ define "pageContent" }}
<section id="register-section">
    <div class="auth-card">
        <h1>Inscription</h1>
        <p class="auth-subtitle">Rejoins la communauté Lyrics.</p>

        <form action="/auth/register" method="POST" autocomplete="on">
            <label>
                <input type="text" name="username" placeholder="Nom d'utilisateur" required>
            </label>
            <label>
                <input type="email" name="email" placeholder="Email" required>
            </label>
            <label>
                <input type="password" name="password" placeholder="Mot de passe" required>
            </label>
            <label>
                <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
            </label>
            <button type="submit" class="auth-btn">S'inscrire</button>
        </form>

        <p class="auth-switch">Déjà un compte ? <a href="/auth/login">Se connecter</a></p>
    </div>
</section>
{{ end }}
