{{ define "pageTitle" }}Connexion{{ end }}

{{ define "pageContent" }}
<section id="login-section">
    <div class="auth-card">
        <h1>Connexion</h1>
        <p class="auth-subtitle">Bon retour sur Lyrics.</p>

        <form action="/auth/login" method="POST" autocomplete="on">
            <label>
                <input type="email" name="email" placeholder="Adresse email" required>
            </label>
            <label>
                <input type="password" name="password" placeholder="Mot de passe" required>
            </label>
            <button type="submit" class="auth-btn">Se connecter</button>
        </form>

        <p class="auth-switch">Pas encore de compte ? <a href="/auth/register">S'inscrire</a></p>
    </div>
</section>
{{ end }}
