{{ define "asideForum" }}
<div class="aside-container">
    <div class="aside-title">
        <h3>🏆 Top membres</h3>
    </div>
    <div class="aside-tabs">
        <button class="aside-tab-btn active">Likes</button>
        <button class="aside-tab-btn">Réponses</button>
        <button class="aside-tab-btn">Topics</button>
    </div>
    <div class="aside-member-list">
        <!-- Liste des membres à looper -->
        <div class="aside-member">
            <div class="aside-rank"><span>1</span></div>
            <div class="aside-user">
                <div class="aside-avatar">
                    <img src="../../assets/img/user.png" alt="user" />
                </div>
                <div class="aside-user-info">
                    <span>Pseudo</span>
                    <div class="aside-user-stats">
                        <span>Likes</span>
                        <span>Réponses</span>
                        <span>Topics</span>
                    </div>
                </div>
            </div>
            <div class="aside-badge">
                <span>Légende</span>
            </div>
        </div>
    </div>
</div>

<div class="aside-container">
    <div class="aside-title">
        <h3>🆕 Nouveaux sujets</h3>
    </div>
    <div class="aside-topic-list">
        <!-- Liste des nouveaux sujets à looper -->
        <div class="aside-topic">
            <h3>Titre du sujet</h3>
            <span>Il y a x minutes/heures...</span>
        </div>
    </div>
</div>

<div class="aside-container">
    <div class="aside-title">
        <h3>🔥 Discussions populaires</h3>
    </div>
    <div class="aside-topic-list">
        <!-- Liste des discussions populaires à looper -->
        <div class="aside-topic">
            <h3>Titre du sujet</h3>
            <div class="aside-topic-meta">
                <span>234 rép.</span>
                <span>5600 vues</span>
            </div>
        </div>
    </div>
</div>
{{ end }}
