{{ define "pageTitle" }}Mon Profil{{ end }}

{{ define "pageContent" }}
<section id="profile-section">
    <h1>{{ .User.Username }}</h1>
    <p><strong>Bio:</strong> {{ .User.Bio }}</p>

    <div>
        <h2>Informations</h2>
        <p><strong>Email:</strong> {{ .User.Email }}</p>
        <p><strong>Membre depuis:</strong> {{ .User.CreatedAt }}</p>
    </div>

    <div>
        <form action="/profile/modify" method="POST">
            <label for="bio">Bio:</label>

            <label>
                <input type="email" name="email" placeholder="Email" required value="{{ .User.Email }}">
            </label>

            <label>
                <input type="text" name="username" placeholder="Nom d'utilisateur" required value="{{ .User.Username }}">
            </label>

            <textarea id="bio" name="bio" rows="4" required>{{ .User.Bio }}</textarea>

            <input type="submit" value="Modifier">
        </form>
    </div>

    <button onclick="location.href='/auth/logout'">Déconnexion</button>
</section>
{{ end }}
