{{ define "pageTitle" }}Forum{{ end }}

{{ define "forumContent" }}
<div class="forum-category">
    <h2>🎷 Rock - Concerts | <span>x topics</span></h2>
    <hr>
    <div class="topics-container">
        {{ range .Posts }}
        <div class="topic">
            <div class="topic-avatar">
                <img src="{{ .Author.AvatarURL }}" alt="">
            </div>
            <div class="topic-info">
                <span class="topic-pinned">Épinglé</span>
                <h3>{{ .Title }}</h3>
                <span class="topic-author">par {{ .Author.Username }}</span>
            </div>
            <div class="topic-stats">
                <span> {{ .CommentsCount }} Com</span>
                <span> {{ .LikesCount }} Likes</span>
            </div>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
